services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paraiso
      POSTGRES_USER: paraiso
      POSTGRES_PASSWORD: paraiso_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paraiso -d paraiso"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://paraiso:paraiso_local@postgres:5432/paraiso?schema=public
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - media_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: ./apps/web
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
  media_data:
